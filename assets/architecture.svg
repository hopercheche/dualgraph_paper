<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1580" viewBox="0 0 1600 1580" role="img"><title>DualGraph-OSCE architecture: common components, conventional pathway and paired graph execution</title><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#567487"/></marker><marker id="green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#168576"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#19394e}.title{font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#567487}</style></defs><rect width="1600" height="1580" fill="#f6f9fc"/><text x="35" y="44" font-size="28" class="title">DualGraph-OSCE | Shared platform and paired-graph execution</text><text x="35" y="73" font-size="18">Same cases, knowledge, models, speech services and original delivery records; different decision execution.</text><rect x="24" y="94" width="1552" height="205" rx="16" fill="#fff" stroke="#c9d9e4"/><text x="46" y="128" font-size="23" class="title">SHARED COMPONENTS · frozen across study modes</text><rect x="45" y="145" width="355" height="133" rx="11" fill="#f1f7fd" stroke="#347abb" stroke-width="1.4"/><rect x="45" y="145" width="5" height="133" rx="2" fill="#347abb"/><text x="62" y="176" font-size="20" class="title" style="fill:#347abb">Student interface + speech</text><text x="62" y="206" font-size="17">Same task briefing and frontend</text><text x="62" y="231" font-size="17">ASR / TTS; original audio spans</text><text x="62" y="256" font-size="17">Mode assignment stays on server</text><rect x="425" y="145" width="355" height="133" rx="11" fill="#f1f7fd" stroke="#347abb" stroke-width="1.4"/><rect x="425" y="145" width="5" height="133" rx="2" fill="#347abb"/><text x="442" y="176" font-size="20" class="title" style="fill:#347abb">Faculty station materials</text><text x="442" y="206" font-size="17">Case facts and role boundaries</text><text x="442" y="231" font-size="17">Original rubric + clarifications</text><text x="442" y="256" font-size="17">Versioned medication conditions</text><rect x="805" y="145" width="355" height="133" rx="11" fill="#f1f7fd" stroke="#347abb" stroke-width="1.4"/><rect x="805" y="145" width="5" height="133" rx="2" fill="#347abb"/><text x="822" y="176" font-size="20" class="title" style="fill:#347abb">Pharmacy KG + RAG</text><text x="822" y="206" font-size="17">Indications and contraindications</text><text x="822" y="231" font-size="17">Condition-qualified interactions</text><text x="822" y="256" font-size="17">Regimens, sources and versions</text><rect x="1185" y="145" width="368" height="133" rx="11" fill="#f1f7fd" stroke="#347abb" stroke-width="1.4"/><rect x="1185" y="145" width="5" height="133" rx="2" fill="#347abb"/><text x="1202" y="176" font-size="20" class="title" style="fill:#347abb">Model + delivery services</text><text x="1202" y="206" font-size="17">Same model identity / parameters</text><text x="1202" y="231" font-size="17">Transcript speaker and time</text><text x="1202" y="256" font-size="17">Draft / sent / delivered records</text><polyline points="240,299 240,337" fill="none" stroke="#567487" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><polyline points="1030,299 1030,337" fill="none" stroke="#567487" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="24" y="337" width="449" height="1180" rx="16" fill="#fff" stroke="#c9d9e4"/><text x="46" y="371" font-size="23" class="title">A · CONVENTIONAL + RAG</text><text x="46" y="399" font-size="17">Independent role and marking calls</text><rect x="47" y="427" width="401" height="184" rx="11" fill="#f1f7fd" stroke="#347abb" stroke-width="1.4"/><rect x="47" y="427" width="5" height="184" rx="2" fill="#347abb"/><text x="64" y="458" font-size="20" class="title" style="fill:#347abb">Role generation</text><text x="64" y="488" font-size="17">Case + role policy + full prefix</text><text x="64" y="513" font-size="17">Same relevant pharmacy retrieval</text><text x="64" y="538" font-size="17">LLM generates the next role reply</text><text x="64" y="563" font-size="17">Retain ordinary output guards</text><polyline points="247,611 247,652" fill="none" stroke="#567487" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="47" y="652" width="401" height="151" rx="11" fill="#f1f7fd" stroke="#347abb" stroke-width="1.4"/><rect x="47" y="652" width="5" height="151" rx="2" fill="#347abb"/><text x="64" y="683" font-size="20" class="title" style="fill:#347abb">Actual encounter log</text><text x="64" y="713" font-size="17">Speaker, span and order</text><text x="64" y="738" font-size="17">Delivered role utterances / prompts</text><text x="64" y="763" font-size="17">Full dialogue kept for later marking</text><polyline points="75,652 75,630 27,630 27,486 47,486" fill="none" stroke="#567487" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)" stroke-dasharray="7 5"/><text x="50" y="846" font-size="16" class="title" style="fill:#7756a4">AFTER THE ENCOUNTER</text><polyline points="247,803 247,871" fill="none" stroke="#567487" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="47" y="871" width="401" height="199" rx="11" fill="#f7f3fc" stroke="#8062aa" stroke-width="1.4"/><rect x="47" y="871" width="5" height="199" rx="2" fill="#8062aa"/><text x="64" y="902" font-size="20" class="title" style="fill:#8062aa">Separate assessment LLM</text><text x="64" y="932" font-size="17">Full dialogue + original rubric</text><text x="64" y="957" font-size="17">Same relevant pharmacy knowledge</text><text x="64" y="982" font-size="17">Item decisions and quoted evidence</text><text x="64" y="1007" font-size="17">Prompt effects reconstructed here</text><polyline points="247,1070 247,1110" fill="none" stroke="#567487" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="47" y="1110" width="401" height="153" rx="11" fill="#f4f7fa" stroke="#728595" stroke-width="1.4"/><rect x="47" y="1110" width="5" height="153" rx="2" fill="#728595"/><text x="64" y="1141" font-size="20" class="title" style="fill:#728595">Shared report schema</text><text x="64" y="1171" font-size="17">Status, consequences and review</text><text x="64" y="1196" font-size="17">Original source evidence</text><text x="64" y="1221" font-size="17">No graph-execution dependency</text><text x="47" y="1320" font-size="18" class="title">Strong comparator:</text><text x="47" y="1352" font-size="16">MedSimAI-inspired simulation and scoring;</text><text x="47" y="1380" font-size="16">RAG is our shared pharmacy extension.</text><text x="47" y="1422" font-size="16">Not a deliberately unguarded chatbot.</text><rect x="497" y="337" width="1079" height="1180" rx="16" fill="#fff" stroke="#c9d9e4"/><text x="519" y="371" font-size="23" class="title">B · DUALGRAPH-OSCE</text><text x="520" y="399" font-size="17">EGJ core engine · separate rules, common evidence revision</text><rect x="521" y="427" width="489" height="153" rx="11" fill="#f7f3fc" stroke="#8062aa" stroke-width="1.4"/><rect x="521" y="427" width="5" height="153" rx="2" fill="#8062aa"/><text x="538" y="458" font-size="20" class="title" style="fill:#8062aa">R · Frozen Rule Graph</text><text x="538" y="488" font-size="17">Role permissions + assessment criteria</text><text x="538" y="513" font-size="17">Typed prerequisites; source / drug / time</text><text x="538" y="538" font-size="17">AND / OR / BEFORE / ONCE / GATE</text><text x="538" y="563" font-size="17">Approved effects and review conditions</text><rect x="1034" y="427" width="515" height="153" rx="11" fill="#fff9ef" stroke="#bd842a" stroke-width="1.4"/><rect x="1034" y="427" width="5" height="153" rx="2" fill="#bd842a"/><text x="1051" y="458" font-size="20" class="title" style="fill:#bd842a">E · Online Evidence Graph</text><text x="1051" y="488" font-size="17">Student actions and delivered role events</text><text x="1051" y="513" font-size="17">Speaker / source span / drug / regimen / time</text><text x="1051" y="538" font-size="17">derived_from / corrects / actual_delivery</text><text x="1051" y="563" font-size="17">Append history; retain corrected errors</text><rect x="521" y="630" width="303" height="154" rx="11" fill="#f1f7fd" stroke="#347abb" stroke-width="1.4"/><rect x="521" y="630" width="5" height="154" rx="2" fill="#347abb"/><text x="538" y="661" font-size="20" class="title" style="fill:#347abb">Semantic evidence agent</text><text x="538" y="691" font-size="17">New utterance + recent context</text><text x="538" y="716" font-size="17">Atomic events; optional NLI</text><text x="538" y="741" font-size="17">Exact-span / type validation</text><text x="538" y="766" font-size="17">Validated candidates only</text><polyline points="674,580 674,630" fill="none" stroke="#567487" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="546" y="610" font-size="15" style="fill:#567487">rule-leaf context</text><polyline points="824,706 848,706 848,604 1290,604 1290,580" fill="none" stroke="#168576" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#green)"/><text x="995" y="618" font-size="15" style="fill:#168576">append validated events</text><rect x="868" y="648" width="681" height="172" rx="11" fill="#eef8f4" stroke="#168576" stroke-width="1.4"/><rect x="868" y="648" width="5" height="172" rx="2" fill="#168576"/><text x="885" y="679" font-size="20" class="title" style="fill:#168576">EGJ · Deterministic executor</text><text x="885" y="709" font-size="17">R + verified E + versioned session state S</text><text x="885" y="734" font-size="17">Source eligibility; medication/patient/regimen joins</text><text x="885" y="759" font-size="17">Temporal order; prompt allowance; correction history</text><text x="885" y="784" font-size="17">Evaluate affected rules; retain unknown evidence</text><polyline points="985,580 985,648" fill="none" stroke="#567487" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="995" y="629" font-size="15" style="fill:#567487">R</text><polyline points="1472,580 1472,648" fill="none" stroke="#567487" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="1484" y="629" font-size="15" style="fill:#567487">E</text><polyline points="990,820 990,849 760,849 760,879" fill="none" stroke="#168576" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#green)"/><polyline points="1350,820 1350,879" fill="none" stroke="#168576" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#green)"/><rect x="521" y="879" width="489" height="180" rx="11" fill="#eef8f4" stroke="#168576" stroke-width="1.4"/><rect x="521" y="879" width="5" height="180" rx="2" fill="#168576"/><text x="538" y="910" font-size="20" class="title" style="fill:#168576">Output 1 · Role permissions</text><text x="538" y="940" font-size="17">Required / permitted / forbidden content</text><text x="538" y="965" font-size="17">Authorized prompt IDs and conditions</text><text x="538" y="990" font-size="17">No private rubric answers or grade caps</text><text x="538" y="1015" font-size="17">Generator sees this projection only</text><rect x="1034" y="879" width="515" height="180" rx="11" fill="#f7f3fc" stroke="#8062aa" stroke-width="1.4"/><rect x="1034" y="879" width="5" height="180" rx="2" fill="#8062aa"/><text x="1051" y="910" font-size="20" class="title" style="fill:#8062aa">Output 2 · Assessment state</text><text x="1051" y="940" font-size="17">MET / PENDING / NOT_MET / UNCERTAIN</text><text x="1051" y="965" font-size="17">Applicable effects; error/correction state</text><text x="1051" y="990" font-size="17">Review reasons and proof/source pointers</text><text x="1051" y="1015" font-size="17">Uses the same event revision</text><polyline points="765,1059 765,1098" fill="none" stroke="#567487" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="521" y="1098" width="489" height="117" rx="11" fill="#f1f7fd" stroke="#347abb" stroke-width="1.4"/><rect x="521" y="1098" width="5" height="117" rx="2" fill="#347abb"/><text x="538" y="1129" font-size="20" class="title" style="fill:#347abb">Role generator + reply auditor</text><text x="538" y="1159" font-size="17">Shared LLM; permission-bound draft</text><text x="538" y="1184" font-size="17">Check actual text before student exposure</text><polyline points="765,1215 765,1254" fill="none" stroke="#567487" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="521" y="1254" width="489" height="141" rx="11" fill="#fff9ef" stroke="#bd842a" stroke-width="1.4"/><rect x="521" y="1254" width="5" height="141" rx="2" fill="#bd842a"/><text x="538" y="1285" font-size="20" class="title" style="fill:#bd842a">Actual delivery gateway</text><text x="538" y="1315" font-size="17">Commit only delivered content/range</text><text x="538" y="1340" font-size="17">Consume prompt; activate linked effects</text><text x="538" y="1365" font-size="17">Draft and uncertain delivery kept distinct</text><polyline points="1010,1325 1561,1325 1561,409 1320,409 1320,427" fill="none" stroke="#168576" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#green)"/><text x="1063" y="1348" font-size="15" style="fill:#168576">commit delivered event → E</text><polyline points="1290,1059 1290,1098" fill="none" stroke="#567487" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="1034" y="1098" width="515" height="165" rx="11" fill="#f4f7fa" stroke="#728595" stroke-width="1.4"/><rect x="1034" y="1098" width="5" height="165" rx="2" fill="#728595"/><text x="1051" y="1129" font-size="20" class="title" style="fill:#728595">End-of-encounter replay + report</text><text x="1051" y="1159" font-size="17">Close applicable deadlines; replay frozen R/E</text><text x="1051" y="1184" font-size="17">Explain stored proofs, not fresh free grading</text><text x="1051" y="1209" font-size="17">Same report schema as A</text><text x="1051" y="1234" font-size="17">Faculty review for unresolved conditions</text><text x="521" y="1446" font-size="16">Session state S: unlocked facts • delivered prompts • current regimen • open deadlines • review reasons</text><text x="521" y="1476" font-size="16">Deterministic execution is conditional on validated inputs; uncertain semantics do not become certainty.</text><text x="35" y="1551" font-size="17">Blue: shared LLM services | Purple: approved rules / assessment | Amber: actual evidence | Green: rule execution</text></svg>