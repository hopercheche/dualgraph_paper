<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="875" viewBox="0 0 1480 875" role="img"><title>Turn-level evidence extraction, permission check and delivery-aware state update</title><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#567487"/></marker><marker id="green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#168576"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#19394e}.title{font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#567487}</style></defs><rect width="1480" height="875" fill="#f6f9fc"/><text x="32" y="45" font-size="27" class="title">One turn: interpret language, execute rules, commit actual delivery</text><text x="32" y="78" font-size="18">Role and assessment views refer to the same evidence revision. A draft is not a learner exposure.</text><rect x="35" y="132" width="310" height="158" rx="11" fill="#f1f7fd" stroke="#347abb" stroke-width="1.4"/><rect x="35" y="132" width="5" height="158" rx="2" fill="#347abb"/><text x="52" y="163" font-size="20" class="title" style="fill:#347abb">1 · Register student turn</text><text x="52" y="193" font-size="17">Original transcript + speaker</text><text x="52" y="218" font-size="17">Exact span and temporal order</text><text x="52" y="243" font-size="17">Recent context for references</text><rect x="390" y="132" width="310" height="158" rx="11" fill="#f1f7fd" stroke="#347abb" stroke-width="1.4"/><rect x="390" y="132" width="5" height="158" rx="2" fill="#347abb"/><text x="407" y="163" font-size="20" class="title" style="fill:#347abb">2 · Extract and validate</text><text x="407" y="193" font-size="17">Action / stance / medicine</text><text x="407" y="218" font-size="17">Source checks and typed bindings</text><text x="407" y="243" font-size="17">Uncertain candidates stay unknown</text><rect x="745" y="132" width="335" height="158" rx="11" fill="#eef8f4" stroke="#168576" stroke-width="1.4"/><rect x="745" y="132" width="5" height="158" rx="2" fill="#168576"/><text x="762" y="163" font-size="20" class="title" style="fill:#168576">3 · Execute affected rules</text><text x="762" y="193" font-size="17">Frozen R + verified E + state S</text><text x="762" y="218" font-size="17">Evidence joins and temporal checks</text><text x="762" y="243" font-size="17">Update current criterion status</text><rect x="1125" y="132" width="320" height="158" rx="11" fill="#eef8f4" stroke="#168576" stroke-width="1.4"/><rect x="1125" y="132" width="5" height="158" rx="2" fill="#168576"/><text x="1142" y="163" font-size="20" class="title" style="fill:#168576">4 · Permission projection</text><text x="1142" y="193" font-size="17">Must / may / must not say</text><text x="1142" y="218" font-size="17">Authorized prompts + allowance</text><text x="1142" y="243" font-size="17">Private grading content removed</text><polyline points="345,210 390,210" fill="none" stroke="#567487" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><polyline points="700,210 745,210" fill="none" stroke="#567487" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><polyline points="1080,210 1125,210" fill="none" stroke="#567487" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><polyline points="1285,290 1285,367" fill="none" stroke="#567487" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="1125" y="367" width="320" height="158" rx="11" fill="#f1f7fd" stroke="#347abb" stroke-width="1.4"/><rect x="1125" y="367" width="5" height="158" rx="2" fill="#347abb"/><text x="1142" y="398" font-size="20" class="title" style="fill:#347abb">5 · Generate and audit</text><text x="1142" y="428" font-size="17">Shared role LLM creates draft</text><text x="1142" y="453" font-size="17">Audit actual draft against policy</text><text x="1142" y="478" font-size="17">Reject / bounded retry if needed</text><rect x="745" y="367" width="335" height="158" rx="11" fill="#fff9ef" stroke="#bd842a" stroke-width="1.4"/><rect x="745" y="367" width="5" height="158" rx="2" fill="#bd842a"/><text x="762" y="398" font-size="20" class="title" style="fill:#bd842a">6 · Confirm actual delivery</text><text x="762" y="428" font-size="17">TTS / text delivery range</text><text x="762" y="453" font-size="17">Delivered prompt or role action</text><text x="762" y="478" font-size="17">Partial / uncertain delivery flagged</text><rect x="390" y="367" width="310" height="158" rx="11" fill="#fff9ef" stroke="#bd842a" stroke-width="1.4"/><rect x="390" y="367" width="5" height="158" rx="2" fill="#bd842a"/><text x="407" y="398" font-size="20" class="title" style="fill:#bd842a">7 · Append E and update S</text><text x="407" y="428" font-size="17">Store event and provenance</text><text x="407" y="453" font-size="17">Consume delivered prompt</text><text x="407" y="478" font-size="17">Keep history and correction links</text><rect x="35" y="367" width="310" height="158" rx="11" fill="#eef8f4" stroke="#168576" stroke-width="1.4"/><rect x="35" y="367" width="5" height="158" rx="2" fill="#168576"/><text x="52" y="398" font-size="20" class="title" style="fill:#168576">8 · Execute linked effects</text><text x="52" y="428" font-size="17">Re-evaluate affected conditions</text><text x="52" y="453" font-size="17">Apply approved consequences</text><text x="52" y="478" font-size="17">Return a new state revision</text><polyline points="1125,450 1080,450" fill="none" stroke="#567487" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><polyline points="745,450 700,450" fill="none" stroke="#567487" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><polyline points="390,450 345,450" fill="none" stroke="#567487" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><polyline points="195,367 195,330 910,330 910,290" fill="none" stroke="#168576" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#green)"/><text x="370" y="321" font-size="15" style="fill:#168576">next-turn state / incremental re-evaluation</text><rect x="35" y="612" width="1410" height="198" rx="16" fill="#fff" stroke="#c9d9e4"/><text x="57" y="646" font-size="23" class="title">At encounter end: replay the same confirmed rules and evidence</text><text x="58" y="681" font-size="19">Close only applicable deadlines → final tuple and rule trace → explanation with original spans → faculty review if required</text><text x="58" y="725" font-size="17">Unplayed draft: no consumed prompt and no prompt consequence. Unauthorized delivered answer: system interference, not student credit.</text><text x="58" y="765" font-size="17">Unknown drug mapping / conflicting source / uncertain delivery: preserve the uncertainty and its review reason.</text></svg>