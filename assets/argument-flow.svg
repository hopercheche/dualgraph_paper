<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="570" viewBox="0 0 1440 570" role="img"><title>Evidence-qualified completion and delivered role interventions link two separate decision paths</title><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#567487"/></marker><marker id="green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#168576"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#19394e}.title{font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#567487}</style></defs><rect width="1440" height="570" fill="#f6f9fc"/><text x="30" y="44" font-size="28" class="title">The synchronization mechanism</text><rect x="30" y="98" width="406" height="179" rx="11" fill="#fff9ef" stroke="#bd842a" stroke-width="1.4"/><rect x="30" y="98" width="5" height="179" rx="2" fill="#bd842a"/><text x="47" y="129" font-size="20" class="title" style="fill:#bd842a">Eligible student evidence</text><text x="47" y="159" font-size="17">Speaker + required action</text><text x="47" y="184" font-size="17">Medicine / patient / regimen conditions</text><text x="47" y="209" font-size="17">Original source span + temporal order</text><text x="47" y="234" font-size="17">Same completion condition</text><rect x="504" y="98" width="406" height="179" rx="11" fill="#eef8f4" stroke="#168576" stroke-width="1.4"/><rect x="504" y="98" width="5" height="179" rx="2" fill="#168576"/><text x="521" y="129" font-size="20" class="title" style="fill:#168576">Role permission</text><text x="521" y="159" font-size="17">Is this prompt still allowed?</text><text x="521" y="184" font-size="17">Has the student already completed it?</text><text x="521" y="209" font-size="17">Are trigger and allowance satisfied?</text><text x="521" y="234" font-size="17">Authorize content, not private grades</text><rect x="978" y="98" width="432" height="179" rx="11" fill="#fff9ef" stroke="#bd842a" stroke-width="1.4"/><rect x="978" y="98" width="5" height="179" rx="2" fill="#bd842a"/><text x="995" y="129" font-size="20" class="title" style="fill:#bd842a">Actual delivered intervention</text><text x="995" y="159" font-size="17">Verified utterance / prompt ID</text><text x="995" y="184" font-size="17">Consumed role allowance</text><text x="995" y="209" font-size="17">Real timing and exposure</text><text x="995" y="234" font-size="17">Drafts do not activate these effects</text><polyline points="436,184 504,184" fill="none" stroke="#567487" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><polyline points="910,184 978,184" fill="none" stroke="#567487" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="504" y="351" width="906" height="154" rx="11" fill="#f7f3fc" stroke="#8062aa" stroke-width="1.4"/><rect x="504" y="351" width="5" height="154" rx="2" fill="#8062aa"/><text x="521" y="382" font-size="20" class="title" style="fill:#8062aa">Separate assessment rules</text><text x="521" y="412" font-size="17">Use the same eligible student evidence and real intervention history</text><text x="521" y="437" font-size="17">Recognize content completion; apply approved prompted-completion consequences</text><text x="521" y="462" font-size="17">Retain errors/corrections and review interference without inventing new marking standards</text><polyline points="230,277 230,427 504,427" fill="none" stroke="#567487" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><text x="251" y="415" font-size="15" style="fill:#567487">shared eligible evidence</text><polyline points="1194,277 1194,351" fill="none" stroke="#168576" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#green)"/><text x="892" y="325" font-size="15" style="fill:#168576">actual intervention → applicable consequence</text><text x="30" y="546" font-size="18">The graph connection is explicit; role and assessment are not merged into a single rule node.</text></svg>