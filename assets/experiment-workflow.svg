<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="830" viewBox="0 0 1500 830" role="img"><title>Freeze input and faculty reference, run paired modes and linking ablation, and analyze clusters and feasibility</title><defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#567487"/></marker><marker id="green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#168576"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#19394e}.title{font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#567487}</style></defs><rect width="1500" height="830" fill="#f6f9fc"/><text x="30" y="44" font-size="28" class="title">Study workflow | two outcomes, one fair A/B comparison</text><text x="30" y="80" font-size="18">Target: 120 checkpoints across four stations. Live source/feasibility target: 16 consultations, not necessarily 16 students.</text><rect x="35" y="130" width="325" height="168" rx="11" fill="#f1f7fd" stroke="#347abb" stroke-width="1.4"/><rect x="35" y="130" width="5" height="168" rx="2" fill="#347abb"/><text x="52" y="161" font-size="20" class="title" style="fill:#347abb">1 · Prepare and freeze</text><text x="52" y="191" font-size="17">Existing faculty case/rubric rules</text><text x="52" y="216" font-size="17">De-identified transcript + cutoff</text><text x="52" y="241" font-size="17">Source/session/family identifiers</text><text x="52" y="266" font-size="17">Label real versus constructed</text><rect x="403" y="130" width="325" height="168" rx="11" fill="#f1f7fd" stroke="#347abb" stroke-width="1.4"/><rect x="403" y="130" width="5" height="168" rx="2" fill="#347abb"/><text x="420" y="161" font-size="20" class="title" style="fill:#347abb">2 · Faculty reference</text><text x="420" y="191" font-size="17">One criterion tuple per checkpoint</text><text x="420" y="216" font-size="17">Concrete applicable role checks</text><text x="420" y="241" font-size="17">Blind to A/B predictions</text><text x="420" y="266" font-size="17">Independent subset if 2 reviewers</text><rect x="771" y="130" width="325" height="168" rx="11" fill="#f1f7fd" stroke="#347abb" stroke-width="1.4"/><rect x="771" y="130" width="5" height="168" rx="2" fill="#347abb"/><text x="788" y="161" font-size="20" class="title" style="fill:#347abb">3 · Paired execution</text><text x="788" y="191" font-size="17">Same input and cutoff in A and B</text><text x="788" y="216" font-size="17">One next-role reply per mode</text><text x="788" y="241" font-size="17">One current decision per mode</text><text x="788" y="266" font-size="17">Keep first runs and failures</text><rect x="1139" y="130" width="325" height="168" rx="11" fill="#f1f7fd" stroke="#347abb" stroke-width="1.4"/><rect x="1139" y="130" width="5" height="168" rx="2" fill="#347abb"/><text x="1156" y="161" font-size="20" class="title" style="fill:#347abb">4 · Blinded comparison</text><text x="1156" y="191" font-size="17">Check both role replies</text><text x="1156" y="216" font-size="17">Compare the complete decision tuple</text><text x="1156" y="241" font-size="17">Record specific error reasons</text><text x="1156" y="266" font-size="17">Preserve discordant pairs</text><polyline points="360,214 403,214" fill="none" stroke="#567487" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><polyline points="728,214 771,214" fill="none" stroke="#567487" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><polyline points="1096,214 1139,214" fill="none" stroke="#567487" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="35" y="365" width="696" height="226" rx="16" fill="#fff" stroke="#c9d9e4"/><text x="57" y="399" font-size="23" class="title">Mechanism test · saved-graph replay</text><text x="57" y="430" font-size="19">FULL versus UNLINKED: disable only the delivered</text><text x="57" y="461" font-size="19">intervention → assessment-consequence dependency.</text><text x="57" y="502" font-size="17">Same extracted evidence; no new model call or participant.</text><text x="57" y="534" font-size="17">Check applicable cases and unrelated negative controls.</text><text x="57" y="566" font-size="17">Replay does not increase the independent sample count.</text><rect x="765" y="365" width="699" height="226" rx="16" fill="#fff" stroke="#c9d9e4"/><text x="787" y="399" font-size="23" class="title">Live feasibility · ordinary student consultations</text><text x="787" y="430" font-size="19">Standard briefing; students choose their own dialogue.</text><text x="787" y="461" font-size="19">Capture real delivery, failures and participant IDs.</text><text x="787" y="502" font-size="17">Faculty checks and item-wise usability questionnaire.</text><text x="787" y="534" font-size="17">16 consultations ≠ 16 participants or 120 independent cases.</text><text x="787" y="566" font-size="17">Constructed safety cases remain labelled separately.</text><polyline points="485,591 485,636" fill="none" stroke="#567487" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><polyline points="1115,591 1115,636" fill="none" stroke="#567487" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arr)"/><rect x="35" y="637" width="1429" height="141" rx="11" fill="#eef8f4" stroke="#168576" stroke-width="1.4"/><rect x="35" y="637" width="5" height="141" rx="2" fill="#168576"/><text x="52" y="668" font-size="20" class="title" style="fill:#168576">5 · Analyze and state only supported conclusions</text><text x="52" y="698" font-size="17">Role compliance + exact decision agreement; paired differences and failures</text><text x="52" y="723" font-size="17">Preserve source/participant clusters for uncertainty; report station coverage and applicable ablation effects</text><text x="52" y="748" font-size="17">Learning gains, human-OSCE equivalence and universal leakage elimination require further evidence</text></svg>