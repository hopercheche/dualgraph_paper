<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1340" viewBox="0 0 1800 1340" role="img" aria-label="Shared CUHK platform: conventional RAG and paired-graph execution"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#47687d"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18364c}.title{font-size:29px;font-weight:700}.sub{font-size:18px;fill:#526b7c}.head{font-size:23px;font-weight:700}.body{font-size:19px}.tag{font-size:16px;font-weight:700;fill:#047e87}.link{fill:none;stroke:#47687d;stroke-width:2.5;marker-end:url(#arrow)}</style><rect width="1800" height="1340" fill="#f8fbfd"/><text class="title" x="45" y="55">Shared CUHK platform: conventional RAG and paired-graph execution</text><text class="sub" x="45" y="90">Same frontend, station documents, clinical source snapshot, model identities and confirmed delivered input.</text><g><rect x="45" y="125" width="1710" height="165" rx="16" fill="#eef5fa" stroke="#57809d" stroke-width="1.5"/><rect x="45" y="125" width="6" height="165" rx="3" fill="#57809d"/><text class="head" x="67" y="163">Shared platform and frozen resources</text><text class="body" x="67" y="199">Four station briefs and original rubrics · faculty clarifications · clinical knowledge graph / RAG with source provenance</text><text class="body" x="67" y="227">Same role/assessment LLM versions and settings · ASR/TTS and role voice · quote-integrity and delivery infrastructure</text><text class="body" x="67" y="255">Server chooses the session mode; the frontend stays neutral. Record all source, model and rule versions.</text></g><path class="link" d="M900 290 V325 H455 V355"/><path class="link" d="M900 325 H1345 V355"/><g><rect x="45" y="355" width="825" height="95" rx="16" fill="#edf4fc" stroke="#5480b0" stroke-width="1.5"/><rect x="45" y="355" width="6" height="95" rx="3" fill="#5480b0"/><text class="head" x="67" y="393">A · conventional_rag</text></g><g><rect x="930" y="355" width="825" height="95" rx="16" fill="#edf9f7" stroke="#168a87" stroke-width="1.5"/><rect x="930" y="355" width="6" height="95" rx="3" fill="#168a87"/><text class="head" x="952" y="393">B · egj / DualGraph-OSCE</text></g><g><rect x="70" y="480" width="775" height="165" rx="16" fill="#eef5fa" stroke="#57809d" stroke-width="1.5"/><rect x="70" y="480" width="6" height="165" rx="3" fill="#57809d"/><text class="head" x="92" y="518">During the consultation</text><text class="body" x="92" y="554">Role LLM interprets source permissions + retrieved</text><text class="body" x="92" y="582">clinical context + delivered dialogue history.</text><text class="body" x="92" y="610">Review → release → record actual delivery.</text></g><g><rect x="955" y="480" width="775" height="165" rx="16" fill="#edf9f7" stroke="#168a87" stroke-width="1.5"/><rect x="955" y="480" width="6" height="165" rx="3" fill="#168a87"/><text class="head" x="977" y="518">Compile rules and update sourced evidence</text><text class="body" x="977" y="554">Rule Graph: separate role and rubric nodes, linked</text><text class="body" x="977" y="582">through explicit prerequisites and consequences.</text><text class="body" x="977" y="610">Evidence Graph: delivered acts, order, prompts, corrections.</text></g><path class="link" d="M455 645 V695"/><path class="link" d="M1345 645 V695"/><g><rect x="70" y="695" width="775" height="165" rx="16" fill="#f4f0fa" stroke="#8568af" stroke-width="1.5"/><rect x="70" y="695" width="6" height="165" rx="3" fill="#8568af"/><text class="head" x="92" y="733">After the consultation</text><text class="body" x="92" y="769">Assessment LLM interprets full dialogue + source rubric</text><text class="body" x="92" y="797">+ retrieved professional context.</text><text class="body" x="92" y="825">Shared quote/schema checks verify output integrity.</text></g><g><rect x="955" y="695" width="775" height="165" rx="16" fill="#edf9f7" stroke="#168a87" stroke-width="1.5"/><rect x="955" y="695" width="6" height="165" rx="3" fill="#168a87"/><text class="head" x="977" y="733">Evidence-Graph Judge execution core</text><text class="body" x="977" y="769">LLM: semantic evidence alignment, with source spans.</text><text class="body" x="977" y="797">Deterministic code: execute confirmed rules and states.</text><text class="body" x="977" y="825">Unresolved input/rules → uncertainty and review.</text></g><path class="link" d="M1345 860 V895 H1148 V925"/><path class="link" d="M1345 895 H1540 V925"/><g><rect x="955" y="925" width="375" height="185" rx="16" fill="#edf4fc" stroke="#5480b0" stroke-width="1.5"/><rect x="955" y="925" width="6" height="185" rx="3" fill="#5480b0"/><text class="head" x="977" y="963">Role permissions</text><text class="body" x="977" y="999">Required / allowed actions</text><text class="body" x="977" y="1027">Prohibited disclosures</text><text class="body" x="977" y="1055">Prompt availability</text><text class="body" x="977" y="1083">Same role LLM generates</text></g><g><rect x="1355" y="925" width="375" height="185" rx="16" fill="#f4f0fa" stroke="#8568af" stroke-width="1.5"/><rect x="1355" y="925" width="6" height="185" rx="3" fill="#8568af"/><text class="head" x="1377" y="963">Assessment state</text><text class="body" x="1377" y="999">Criterion completion</text><text class="body" x="1377" y="1027">Applicable consequences</text><text class="body" x="1377" y="1055">Error/correction history</text><text class="body" x="1377" y="1083">Faculty review reasons</text></g><path class="link" d="M1148 1110 V1140 H1775 V555 H1730"/><text class="tag" x="1090" y="1170">Only committed delivered actions update later permissions and consequences.</text><path class="link" d="M455 860 V1188 H900 V1210"/><path class="link" d="M1540 1110 V1188 H900"/><g><rect x="45" y="1210" width="1710" height="92" rx="16" fill="#eef5fa" stroke="#57809d" stroke-width="1.5"/><rect x="45" y="1210" width="6" height="92" rx="3" fill="#57809d"/><text class="head" x="67" y="1248">Shared report adapter and experiment export</text><text class="body" x="67" y="1284">Neutral student report · source quotes · versions and failures · independent faculty references kept separate</text></g></svg>